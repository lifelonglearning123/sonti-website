<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0b0b0a;
          overflow: hidden;
        }
        .shot {
          position: absolute;
          inset: 0;
          visibility: hidden;
        }
        .frame {
          position: absolute;
          left: 0;
          top: 250px;
          width: 1080px;
          height: 1350px;
          overflow: hidden;
        }
        .frame img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          transform-origin: 50% 36%;
        }
      </style>

      <div id="root" data-composition-id="f09-team" data-width="1080" data-height="1920">
        <!-- Briefed in the UK -->
        <div class="shot" id="team-1"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p1-avijit.jpg" alt="" /></div></div>
        <div class="shot" id="team-2"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p2-chao.jpg" alt="" /></div></div>
        <div class="shot" id="team-3"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p3-soli.jpg" alt="" /></div></div>
        <!-- built in India -->
        <div class="shot" id="team-4"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p4-sushanta.jpg" alt="" /></div></div>
        <div class="shot" id="team-5"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p5-soham.jpg" alt="" /></div></div>
        <div class="shot" id="team-6"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p6-biswanath.jpg" alt="" /></div></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const count = 6;
        const hold = 14 / count; // one at a time, even beats; hard cuts between
        for (let i = 1; i <= count; i++) {
          const at = (i - 1) * hold;
          tl.set(`#team-${i}`, { visibility: "visible" }, at);
          if (i < count) tl.set(`#team-${i}`, { visibility: "hidden" }, at + hold);
          tl.fromTo(
            `#team-${i} img`,
            { scale: 1 },
            { scale: 1.045, duration: hold, ease: "none", immediateRender: i === 1 },
            at,
          );
        }
        window.__timelines["f09-team"] = tl;
      </script>
    </template>
  </body>
</html>
