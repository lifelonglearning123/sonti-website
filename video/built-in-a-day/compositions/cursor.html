<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          pointer-events: none;
        }
        /* The arrow's tip is the element's top-left corner, so x/y below are the tip position. */
        .cursor {
          position: absolute;
          left: 0;
          top: 0;
          width: 44px;
          height: 60px;
          transform: translate(840px, 1120px);
        }
        .cursor svg {
          display: block;
          width: 100%;
          height: 100%;
          filter: drop-shadow(0 6px 14px rgba(11, 11, 10, 0.35));
        }
      </style>

      <div id="root" data-composition-id="cursor" data-width="1080" data-height="1920">
        <div class="cursor" id="cursor-arrow">
          <svg viewBox="0 0 22 30" aria-hidden="true">
            <path d="M1 1 L1 23 L6.5 18 L10 27 L14 25.5 L10.5 16.8 L18 16.8 Z" fill="#ffffff" stroke="#0b0b0a" stroke-width="1.6" stroke-linejoin="round" />
          </svg>
        </div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        // Hero buttons measured on b07-hero-hold.mp4 (frame px): "Talk to our site" 368,584 170×45;
        // "See the work" 550,584 162×45. Move only — the script asks for a cursor moving, not a click.
        const START = { x: 840, y: 1120 };
        const WORK = { x: 640, y: 612 };
        const TALK = { x: 470, y: 612 };
        tl.set("#cursor-arrow", { x: START.x, y: START.y }, 0);
        tl.to("#cursor-arrow", { x: WORK.x, y: WORK.y, duration: 1.0, ease: "power3.out" }, 0.3);
        tl.to("#cursor-arrow", { x: TALK.x, y: TALK.y, duration: 0.8, ease: "power2.inOut" }, 1.9);
        tl.to("#cursor-arrow", { x: TALK.x + 6, y: TALK.y + 4, duration: 0.9, ease: "sine.inOut" }, 2.8);
        window.__timelines["cursor"] = tl;
      </script>
    </template>
  </body>
</html>
