<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0b0b0a;
          overflow: hidden;
        }
        .shot {
          position: absolute;
          inset: 0;
          visibility: hidden;
        }
        .frame {
          position: absolute;
          left: 60px;
          top: 540px;
          width: 960px;
          height: 1200px;
          overflow: hidden;
          border-radius: 28px;
        }
        .frame img {
          display: block;
          width: 100%;
          height: 100%;
          object-fit: cover;
          transform-origin: 50% 34%;
        }
      </style>

      <div id="root" data-composition-id="team" data-width="1080" data-height="1920">
        <div class="shot" id="face-1"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p1-avijit.jpg" alt="" /></div></div>
        <div class="shot" id="face-2"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p2-chao.jpg" alt="" /></div></div>
        <div class="shot" id="face-3"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p4-sushanta.jpg" alt="" /></div></div>
        <div class="shot" id="face-4"><div class="frame" data-layout-allow-overflow><img src="assets/photos/p5-soham.jpg" alt="" /></div></div>
      </div>

      <script>
        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });
        const HOLD = 1; // two beats at 120 BPM — one face per beat of the bar
        for (let i = 1; i <= 4; i++) {
          const at = (i - 1) * HOLD;
          tl.set(`#face-${i}`, { visibility: "visible" }, at);
          if (i < 4) tl.set(`#face-${i}`, { visibility: "hidden" }, at + HOLD);
          tl.fromTo(`#face-${i} img`, { scale: 1 }, { scale: 1.04, duration: HOLD, ease: "none", immediateRender: i === 1 }, at);
        }
        window.__timelines["team"] = tl;
      </script>
    </template>
  </body>
</html>
